<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JFT Admin</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--blue:#2271b1;--blue-d:#135e96;--text:#1d2327;--muted:#646970;--line:#c3c4c7;--bg:#f0f0f1;--side:#1d2327;--side2:#2c3338;--green:#00a32a;--red:#d63638;--amber:#dba617}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen-Sans,Ubuntu,Cantarell,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);min-width:320px}
a{color:var(--blue)}a:hover{color:var(--blue-d)}
svg{width:20px;height:20px;fill:currentColor;display:block}
/* login */
#login{padding:8% 20px 20px;text-align:center}#login .logo{font:900 44px/1 Arial,sans-serif;letter-spacing:.04em;color:var(--text);margin-bottom:24px}#login .logo span{color:#ff9100}
#login form{max-width:320px;margin:0 auto;background:#fff;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04);padding:26px 24px;text-align:left}
#login label{font-size:14px;display:block;margin-bottom:3px}#login input{font-size:20px;padding:3px 8px;width:100%;margin:0 0 16px;height:40px}
#login .button-primary{width:100%;height:36px;font-size:14px}#login .err{color:var(--red);margin:-6px 0 12px;min-height:16px}
/* admin bar */
#adminbar{position:fixed;top:0;left:0;right:0;height:32px;background:#1d2327;color:#f0f0f1;z-index:1000;display:flex;align-items:center;padding:0}
#adminbar .ab{position:relative;height:32px;display:flex;align-items:center;color:#f0f0f1;text-decoration:none;padding:0 8px;cursor:pointer;background:none;border:0;font:inherit}
#adminbar .ab:hover,#adminbar .ab:focus-within{background:var(--side2);color:#72aee6}#adminbar .grow{flex:1}
#adminbar svg{width:18px;height:18px;margin-right:6px}
.dd{display:none;position:absolute;top:32px;left:0;min-width:160px;background:var(--side2);z-index:5}.ab:hover .dd,.ab:focus-within .dd{display:block}.dd.r{left:auto;right:0}
.dd a{display:block;padding:8px 12px;color:#f0f0f1;text-decoration:none;white-space:nowrap}.dd a:hover{color:#72aee6;background:#1d2327}
#burger{display:none}
/* side menu */
#menuwrap{position:fixed;top:32px;bottom:0;left:0;width:160px;background:var(--side);overflow-y:auto;z-index:900;transition:width .1s}
#menu{list-style:none;margin:12px 0 0;padding:0}
.mt>a{display:flex;align-items:center;gap:8px;padding:0 8px;height:34px;color:#f0f0f1;text-decoration:none;font-size:14px}
.mt>a svg{width:20px;height:20px;opacity:.7;flex:none}.mt:hover>a{background:var(--side2);color:#72aee6}.mt:hover>a svg,.mt.cur>a svg{opacity:1}
.mt.cur>a{background:var(--blue);color:#fff}.mt.cur>a:hover{color:#fff}
.sub{list-style:none;margin:0;padding:7px 0 8px;background:var(--side2);display:none}.mt.cur .sub{display:block}
.sub a{display:block;padding:5px 12px 5px 36px;color:rgba(240,246,252,.7);text-decoration:none;font-size:13px}.sub a:hover{color:#72aee6}.sub a.on{color:#fff;font-weight:600}
.bubble{background:var(--red);color:#fff;border-radius:9px;font-size:9px;font-weight:600;padding:1px 6px;margin-left:auto}
.sep{height:1px;background:#3c434a;margin:8px 0}
#collapse{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;color:#a7aaad;padding:0 8px;height:34px;font:inherit;cursor:pointer;margin-top:8px}#collapse:hover{color:#72aee6}
body.folded #menuwrap{width:36px}body.folded .mt>a span,body.folded .sub,body.folded #collapse span,body.folded .bubble{display:none!important}body.folded #content{margin-left:36px}
#content{margin-left:160px;padding:32px 0 0;min-height:100vh}.wrap{padding:10px 20px 60px 20px;max-width:1300px}
/* headings, buttons */
h1.wp-heading{font-size:23px;font-weight:400;margin:0 0 14px;padding:9px 0 4px;line-height:1.3;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.page-title-action{font-size:13px;border:1px solid var(--blue);border-radius:3px;padding:4px 8px;background:#f6f7f7;text-decoration:none;color:var(--blue);cursor:pointer;line-height:1.4}.page-title-action:hover{background:#f0f0f1;border-color:var(--blue-d)}
.button,.button-primary{display:inline-block;font:inherit;font-size:13px;line-height:2.15;min-height:30px;padding:0 10px;border:1px solid var(--blue);border-radius:3px;cursor:pointer;text-decoration:none;white-space:nowrap;background:#f6f7f7;color:var(--blue)}
.button:hover{background:#f0f0f1;border-color:var(--blue-d);color:var(--blue-d)}
.button-primary{background:var(--blue);color:#fff;border-color:var(--blue)}.button-primary:hover{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
.button-link{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font:inherit;text-decoration:underline}.del{color:var(--red)!important}
.button-large{min-height:36px;line-height:2.5;padding:0 14px}
input[type=text],input[type=password],input[type=date],input:not([type]),select,textarea{font:inherit;font-size:14px;padding:4px 8px;border:1px solid #8c8f94;border-radius:4px;background:#fff;color:var(--text);box-shadow:0 0 0 transparent;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);outline:2px solid transparent}
textarea{width:100%;line-height:1.5;resize:vertical}input[type=text],input[type=date],input:not([type]){min-height:30px}
/* notices */
.notice{background:#fff;border:1px solid #c3c4c7;border-left:4px solid var(--green);box-shadow:0 1px 1px rgba(0,0,0,.04);margin:5px 0 15px;padding:10px 38px 10px 12px;position:relative}
.notice.bad{border-left-color:var(--red)}.notice.warn{border-left-color:var(--amber)}.notice .x{position:absolute;right:6px;top:6px;background:none;border:0;font-size:18px;cursor:pointer;color:#787c82}
/* postbox */
.postbox{background:#fff;border:1px solid var(--line);box-shadow:0 1px 1px rgba(0,0,0,.04);margin-bottom:20px}
.postbox>h2{margin:0;padding:8px 12px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);line-height:1.4}.postbox .in{padding:12px}
.postbox h4{margin:14px 0 6px;font-size:13px}.postbox .in>h4:first-child{margin-top:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}.cols.one{grid-template-columns:minmax(0,1fr)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 16px}.grid2>.full{grid-column:1/-1}
.fld label{display:block;font-weight:600;margin-bottom:4px}.fld input,.fld select{width:100%}.hint{color:var(--muted);font-size:12px;margin:4px 0 0}
.titlebox{width:100%;font-size:1.7em;padding:3px 8px;line-height:100%;height:1.7em;margin:0 0 20px;background:#fff}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}.row input{flex:1}
.ib{background:#f6f7f7;border:1px solid #dcdcde;border-radius:3px;min-width:28px;height:28px;cursor:pointer;color:#50575e;font:inherit}.ib:hover{border-color:var(--blue);color:var(--blue)}.ib.x:hover{border-color:var(--red);color:var(--red)}
.acc{border:1px solid #dcdcde;margin-bottom:8px;background:#fff}.acc>.hd{display:flex;gap:6px;align-items:center;padding:6px 8px;background:#f6f7f7;cursor:pointer}.acc>.hd b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acc>.bd{padding:12px;border-top:1px solid #dcdcde}
.pub .misc{padding:10px 12px;border-bottom:1px solid #f0f0f1}.pub .misc label{display:flex;gap:6px;align-items:center;margin-bottom:6px}.pub .foot{padding:10px 12px;background:#f6f7f7;border-top:1px solid #dcdcde;display:flex;justify-content:space-between;align-items:center}
.imgbox{border:1px dashed #c3c4c7;background:#f6f7f7 center/cover no-repeat;min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-bottom:8px;cursor:pointer}.imgbox.has{border-style:solid;min-height:160px}
.lrow{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid #f0f0f1}.lrow label{flex:1;cursor:pointer;font-size:14px}
/* list table */
.subsubsub{list-style:none;margin:0 0 10px;padding:0;color:#646970;font-size:13px}.subsubsub li{display:inline}.subsubsub li+li:before{content:" | "}.subsubsub a.cur{color:var(--text);font-weight:600;text-decoration:none}.subsubsub .n{color:#646970;font-weight:400}
.tablenav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0;justify-content:space-between}.tablenav .l,.tablenav .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
table.wp{border:1px solid #c3c4c7;box-shadow:0 1px 1px rgba(0,0,0,.04);background:#fff;width:100%;border-spacing:0;table-layout:auto}
table.wp th,table.wp td{padding:8px 10px;text-align:left;vertical-align:top;line-height:1.4}table.wp thead th,table.wp tfoot th{border-bottom:1px solid #c3c4c7;font-weight:400;color:var(--text);background:#fff}table.wp tfoot th{border-top:1px solid #c3c4c7;border-bottom:0}
table.wp tbody tr:nth-child(odd){background:#f6f7f7}table.wp tbody tr:hover{background:#f0f6fc}table.wp .chk{width:2.2em;padding:8px 0 8px 10px}table.wp td.thumb{width:64px}
.rt{font-weight:600;font-size:14px;color:var(--blue);text-decoration:none}.rt:hover{color:var(--blue-d)}.rt .st{color:#646970;font-weight:400}
.ra{font-size:13px;padding:2px 0 0;color:#a7aaad;position:relative;left:-9999px}tr:hover .ra,tr:focus-within .ra{position:static}.ra a,.ra button{font-size:13px}
.th{width:50px;height:50px;background:#dcdcde center/cover;border:1px solid #dcdcde}.empty-row td{text-align:center;color:var(--muted);padding:20px}
.pagi{display:flex;gap:4px;align-items:center}.dim{color:var(--muted)}
@media(max-width:782px){table.wp .hide-sm{display:none}.ra{position:static}}
/* dashboard */
.welcome{background:#fff;border:1px solid var(--line);margin:16px 0 20px;padding:23px 10px 0;position:relative;overflow:hidden;background-image:linear-gradient(135deg,#fff 60%,#eaf3fb)}
.welcome h2{margin:0 0 6px 16px;font-size:21px;font-weight:400}.welcome>p{margin:0 0 14px 16px;color:var(--muted);font-size:14px}
.wcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:0 16px 20px}.wcols h3{font-size:14px;margin:0 0 10px}.wcols ul{list-style:none;padding:0;margin:0}.wcols li{margin:0 0 8px}.wcols .button-primary{margin-bottom:12px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;align-items:start}.dash .postbox{margin:0}
.glance{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}.glance a{text-decoration:none;color:var(--blue)}.glance b{font-size:14px;margin-right:4px}
.health li{padding:6px 0;border-bottom:1px solid #f0f0f1;display:flex;gap:8px}.health{list-style:none;margin:0;padding:0}.ok{color:var(--green)}.warn{color:var(--amber)}
.snip{border:1px solid #dfe1e5;border-radius:8px;padding:12px 14px;background:#fff;margin-top:8px}.snip .u{color:#202124;font-size:12px}.snip .t{color:#1a0dab;font-size:18px;line-height:1.3;margin:2px 0}.snip .d{color:#4d5156;font-size:13px}.cnt{font-size:12px;color:var(--muted);margin-top:3px}.cnt.over{color:var(--red)}
/* media */
.grid-media{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.att{aspect-ratio:1;background:#dcdcde center/cover;border:1px solid #c3c4c7;cursor:pointer;position:relative}.att:hover{outline:3px solid var(--blue)}.att.sel{outline:4px solid var(--blue)}
.att.sel:after{content:"✓";position:absolute;right:4px;top:4px;background:var(--blue);color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100000;display:flex;align-items:center;justify-content:center;padding:30px}.mbox{background:#fff;max-width:960px;width:100%;max-height:100%;display:flex;flex-direction:column;box-shadow:0 5px 15px rgba(0,0,0,.7)}
.mbox>h2{margin:0;padding:12px 16px;font-size:18px;border-bottom:1px solid #dcdcde;display:flex;justify-content:space-between}.mbox>.mb{padding:16px;overflow:auto;flex:1}.mbox>.mf{padding:12px 16px;border-top:1px solid #dcdcde;text-align:right;background:#f6f7f7}
#toast{position:fixed;right:20px;bottom:20px;background:#1d2327;color:#fff;padding:10px 16px;border-left:4px solid var(--green);z-index:100001;transform:translateY(80px);transition:.25s;opacity:0}#toast.show{transform:none;opacity:1}#toast.bad{border-color:var(--red)}
/* responsive */
@media(max-width:782px){
 #adminbar{height:46px}#adminbar .ab{height:46px}.dd{top:46px}#burger{display:flex}#adminbar .hide-sm{display:none}
 #menuwrap{top:46px;transform:translateX(-100%);width:190px;transition:transform .2s}body.menuopen #menuwrap{transform:none}
 #content{margin-left:0;padding-top:46px}.cols{grid-template-columns:1fr}.wrap{padding:10px 12px 60px}body.folded #content{margin-left:0}
 .dash{grid-template-columns:1fr}.glance{grid-template-columns:1fr}
}
</style></head><body>

<div id="login"><div class="logo">JFT<span>.</span></div>
 <form id="lf"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="err"></div><button class="button button-primary" id="go" type="submit">Log In</button></form>
 <p style="margin-top:18px"><a href="/">← Go to website</a></p></div>

<div id="app" hidden>
 <div id="adminbar"></div>
 <div id="menuwrap"><ul id="menu"></ul><button id="collapse"></button></div>
 <div id="content"></div>
</div>
<div id="modal" hidden></div><div id="toast" role="status"></div>
